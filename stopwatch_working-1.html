<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Stopwatch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f172a; color: #fff; font-family: Arial, sans-serif; }
  .box { width: min(92%, 420px); padding: 28px 20px; text-align: center;
    border-radius: 20px; background: #1e293b; box-shadow: 0 12px 32px #0005; }
  h1 { margin: 0 0 24px; letter-spacing: 2px; }
  #time { font-size: clamp(2rem, 10vw, 3.2rem); font-weight: bold;
    font-variant-numeric: tabular-nums; margin: 20px 0 28px; }
  button { border: 0; border-radius: 9px; padding: 12px 18px; margin: 4px;
    color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
  #start { background: #16a34a; } #pause { background: #ea580c; }
  #reset { background: #dc2626; }
  #status { color: #cbd5e1; min-height: 1.2em; font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<main class="box">
  <h1>STOPWATCH</h1>
  <div id="time">00:00:00.00</div>
  <button id="start" type="button">Start</button>
  <button id="pause" type="button">Pause</button>
  <button id="reset" type="button">Reset</button>
  <p id="status">Ready</p>
</main>
<script>
(() => {
  const timeDisplay = document.getElementById('time');
  const statusDisplay = document.getElementById('status');
  let elapsed = 0;
  let startStamp = 0;
  let ticker = null;

  function draw() {
    const current = elapsed + (ticker !== null ? Date.now() - startStamp : 0);
    const centiseconds = Math.floor(current / 10) % 100;
    const seconds = Math.floor(current / 1000) % 60;
    const minutes = Math.floor(current / 60000) % 60;
    const hours = Math.floor(current / 3600000);
    timeDisplay.textContent =
      String(hours).padStart(2, '0') + ':' +
      String(minutes).padStart(2, '0') + ':' +
      String(seconds).padStart(2, '0') + '.' +
      String(centiseconds).padStart(2, '0');
  }

  document.getElementById('start').addEventListener('click', () => {
    if (ticker !== null) return;
    startStamp = Date.now();
    ticker = window.setInterval(draw, 10);
    statusDisplay.textContent = 'Running';
    draw();
  });

  document.getElementById('pause').addEventListener('click', () => {
    if (ticker === null) return;
    elapsed += Date.now() - startStamp;
    window.clearInterval(ticker);
    ticker = null;
    draw();
    statusDisplay.textContent = 'Paused';
  });

  document.getElementById('reset').addEventListener('click', () => {
    if (ticker !== null) window.clearInterval(ticker);
    ticker = null;
    elapsed = 0;
    startStamp = 0;
    timeDisplay.textContent = '00:00:00.00';
    statusDisplay.textContent = 'Reset';
  });
})();
</script>
</body>
</html>
